<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__DOCTITLE__</title>
<style>
/*FONTS*/
:root {
  --w: min(92vw, 560px);
  --accent: #d4232a;
  --accent2: #f6a7ab;
  --ink: #1c2a8a;
  --paper: #f3eedf;
}
* { box-sizing: border-box; }
html { background: #0f0d15; overflow-x: hidden; }
html, body { margin: 0; min-height: 100vh; }
body {
  background: radial-gradient(ellipse at 50% 12%, #2f2347 0%, #17141f 55%, #0f0d15 100%) no-repeat;
  color: #f1ecf9;
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  display: flex; flex-direction: column; align-items: center;
  padding: 30px 0 40px; overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
.greet { width: var(--w); text-align: center; margin-bottom: calc(var(--w) * .07); }
.greet small { display: block; letter-spacing: .28em; text-transform: uppercase; font-size: 11px; color: #9d94b4; }
.greet b { display: block; font-family: Caveat, "Segoe Print", "Bradley Hand", cursive; font-size: clamp(30px, 8vw, 44px); font-weight: 700; color: #fff; line-height: 1.1; margin-top: 4px; }

/* ---- the cassette case (clear plastic lid on a black tray) ---- */
.scene { width: var(--w); transition: transform 1.1s cubic-bezier(.3,.7,.2,1); }
#o:checked ~ .scene { transform: translateY(calc(var(--w) * .06)); }
.greet { transition: opacity .5s ease; }
#o:checked ~ .greet { opacity: 0; }
.case { display: block; position: relative; width: var(--w); height: calc(var(--w) * .645); cursor: pointer; outline: none; }
.toggle { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
#o:focus-visible ~ .scene .case { outline: 3px solid #3de0d0; outline-offset: 8px; border-radius: 8px; }
.t-close { display: none; }
#o:checked ~ .scene .t-open { display: none; }
#o:checked ~ .scene .t-close { display: inline; }

.tray {
  position: absolute; inset: 0; border-radius: 6px; overflow: hidden;
  background: linear-gradient(180deg, #2b2b31 0%, #15151a 55%, #0d0d10 100%);
  box-shadow: 0 22px 34px rgba(0,0,0,.55), inset 0 0 0 1.5px rgba(255,255,255,.1);
}
.hinge { position: absolute; left: 0; right: 0; top: 0; height: 6.5%; background: repeating-linear-gradient(90deg, #1b1b20 0 6px, #2c2c33 6px 8px); border-bottom: 1px solid rgba(255,255,255,.12); }
.tray .tape { position: absolute; left: 5.5%; top: 53.5%; width: 89%; height: auto; display: block;
  transform: translateY(-50%); will-change: transform; transition: transform .45s ease; }
#o:checked ~ .scene .tray .tape { transform: translateY(-51.5%) scale(1.025) rotate(-1deg); transition: transform .9s cubic-bezier(.3,.7,.2,1) .6s; }
.tray::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%); }

.lid { position: absolute; inset: 0; transform-origin: center top; transform-style: preserve-3d; transform: perspective(1700px) rotateX(0deg); transition: transform 1.15s cubic-bezier(.3,.7,.2,1); }
#o:checked ~ .scene .lid { transform: perspective(1700px) rotateX(100deg); }
.face { position: absolute; inset: 0; border-radius: 6px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: rgba(205,225,238,.09); border: 1.5px solid rgba(255,255,255,.32);
  box-shadow: inset 0 0 0 4px rgba(255,255,255,.05), 0 0 0 1px rgba(0,0,0,.25); }
.face.back { transform: rotateX(180deg); background: rgba(205,225,238,.16); }
.face::after { content: ""; position: absolute; inset: 0; border-radius: 6px; pointer-events: none;
  background: linear-gradient(112deg, rgba(255,255,255,.5) 0%, rgba(255,255,255,.05) 22%, rgba(255,255,255,0) 55%, rgba(255,255,255,.14) 100%); }

.jcard { position: absolute; left: 3%; right: 3%; top: 7%; bottom: 3.4%; background: linear-gradient(160deg, #f8f4e7 0%, var(--paper) 55%, #e6dfcb 100%); color: #1b1b22; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.18); }
.jcard .spine { position: absolute; left: 0; right: 0; top: 0; height: 13%; background: var(--accent); display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 0 4%; }
.jcard .spine span { font-family: Caveat, "Segoe Print", cursive; font-weight: 700; color: #fff; font-size: clamp(14px, 4vw, 24px); line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
.jcard .bar3 { position: absolute; left: 0; right: 0; top: 13%; height: 1.8%; background: var(--accent2); }
.jcard .body { position: absolute; left: 7%; right: 7%; top: 24%; }
.jcard h1 { margin: 0; font-family: Caveat, "Segoe Print", "Bradley Hand", cursive; font-weight: 700; color: var(--ink); line-height: 1; font-size: clamp(28px, 9vw, 54px); overflow-wrap: anywhere; max-height: 2.1em; overflow: hidden; }
.jcard .tofrom { margin-top: 2.2%; font-family: Caveat, "Segoe Print", cursive; color: var(--ink); font-size: clamp(17px, 4.8vw, 26px); line-height: 1.15; }
.jcard .hint { position: absolute; left: 7%; right: 7%; bottom: 7%; display: flex; justify-content: space-between; align-items: center; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #5b5870; }
.jcard .hint .tap { animation: nudge 2.2s ease-in-out infinite; color: var(--accent); font-weight: 700; }
#o:checked ~ .scene .jcard .hint .tap { animation: none; }
@keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(5px); } }

/* reels turn and the tape pack moves from one reel to the other while the cassette is out */
.reel, .pack { animation-play-state: paused; }
#o:checked ~ .scene .reel, #o:checked ~ .scene .pack { animation-play-state: running; }
.reel { animation: spin 2.6s linear infinite; }
#o:checked ~ .scene .reel { animation-delay: 1.1s; }
@keyframes spin { to { transform: rotate(360deg); } }
.packL { animation: packL 24s ease-in-out infinite alternate; transform: scale(.8); }
.packR { animation: packR 24s ease-in-out infinite alternate; transform: scale(1); }
@keyframes packL { from { transform: scale(.8); } to { transform: scale(1); } }
@keyframes packR { from { transform: scale(1); } to { transform: scale(.8); } }

.list-wrap { width: var(--w); display: grid; grid-template-rows: 0fr; transition: grid-template-rows .8s ease .7s; }
#o:checked ~ .list-wrap { grid-template-rows: 1fr; }
.list-wrap > div { overflow: hidden; }
.card {
  margin: 26px 3% 0; padding: 20px 20px 16px; background: var(--paper); color: #1b1b22; border-radius: 6px;
  border-top: 10px solid var(--accent); box-shadow: 0 16px 28px rgba(0,0,0,.45);
  opacity: 0; transform: translateY(-14px); transition: opacity .6s ease 1.1s, transform .7s ease 1.1s;
}
#o:checked ~ .list-wrap .card { opacity: 1; transform: none; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 440px) { .cols { grid-template-columns: 1fr; } }
.cols h2 { display: flex; justify-content: space-between; margin: 0 0 6px; padding-bottom: 4px; border-bottom: 2px solid #1b1b22; font-size: 13px; letter-spacing: .14em; }
.cols h2 span:last-child { font-weight: 400; color: #666; letter-spacing: 0; }
.cols ol { margin: 0; padding: 0; list-style: none; counter-reset: n; }
.cols li { counter-increment: n; display: grid; grid-template-columns: 22px 1fr auto; gap: 4px; padding: 5px 0; border-bottom: 1px dotted #b9b19a; font-size: 14px; }
.cols li::before { content: counter(n) "."; color: #8a826b; font-variant-numeric: tabular-nums; }
.cols li small { display: block; color: #6c6654; font-size: 12px; }
.cols li em { font-style: normal; color: #8a826b; font-size: 12px; font-variant-numeric: tabular-nums; align-self: center; }
.cols .none { color: #8a826b; font-style: italic; font-size: 13px; padding: 6px 0; }
.note { margin-top: 16px; padding-top: 12px; border-top: 2px solid #1b1b22; font-family: Caveat, "Segoe Print", cursive; color: var(--ink); font-size: 26px; line-height: 1.15; white-space: pre-wrap; }
.foot { margin-top: 26px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #6d6584; }

@media (prefers-reduced-motion: reduce) {
  .scene, .lid, .tray .tape, .list-wrap, .card { transition: none !important; }
  .jcard .hint .tap, .reel, .pack { animation: none !important; }
}
</style>
</head>
<body style="__VARS__">
<input type="checkbox" id="o" class="toggle" aria-label="Open the cassette case">
<div class="greet">__GREET__</div>
<div class="scene">
  <label class="case" for="o" aria-hidden="true">
    <div class="tray"><div class="hinge"></div><!--CASSETTE--></div>
    <div class="lid">
      <div class="face front">
        <div class="jcard">
          <div class="spine"><span>__TITLE__</span></div>
          <i class="bar3"></i>
          <div class="body"><h1>__TITLE__</h1><div class="tofrom">__TOFROM__</div></div>
          <div class="hint"><span>__LEN__</span><span class="tap"><span class="t-open">Tap to open &rsaquo;</span><span class="t-close">Tap to close</span></span></div>
        </div>
      </div>
      <div class="face back"></div>
    </div>
  </label>
</div>
<div class="list-wrap"><div>
  <div class="card">
    <div class="cols">__COLS__</div>
    __NOTE__
  </div>
</div></div>
<div class="foot">Made with Mixtape Maker</div>
</body>
</html>
