version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: patriot-mixtape-maker_web_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/patriotcrypto/mixtape-maker:0.1.0
    restart: on-failure
    stop_grace_period: 1m
    environment:
      PORT: 3000
      MUSIC_DIR: /music
      DATA_DIR: /data
    volumes:
      - ${UMBREL_ROOT}/data/storage/music:/music:ro
      - ${APP_DATA_DIR}/data:/data
